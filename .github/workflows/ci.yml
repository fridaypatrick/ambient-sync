name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Print build environment
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build
        run: >-
          xcodebuild build
          -project AmbientSync.xcodeproj
          -scheme AmbientSync
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: >-
          xcodebuild test
          -project AmbientSync.xcodeproj
          -scheme AmbientSync
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
