name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Print build environment
        run: |
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Build without signing
        run: >-
          xcodebuild build
          -project AmbientSync.xcodeproj
          -scheme AmbientSync
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          MARKETING_VERSION=0.0.0
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO

      - name: Test without signing
        run: >-
          xcodebuild test
          -project AmbientSync.xcodeproj
          -scheme AmbientSync
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          MARKETING_VERSION=0.0.0
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO
