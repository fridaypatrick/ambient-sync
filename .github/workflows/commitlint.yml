name: Commitlint

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request-title:
    runs-on: ubuntu-latest
    steps:
      - name: Lint pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ github.token }}

  commits:
    runs-on: ubuntu-latest
    steps:
      - name: Lint pull request commits
        uses: step-security/commitlint-github-action@ecf49430013036cd8611cfd823056c0e17804648
        env:
          GITHUB_TOKEN: ${{ github.token }}
