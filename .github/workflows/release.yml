name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to rebuild (for example, v1.2.3)
        required: true
        type: string
      version:
        description: Stable release version matching tag without v (for example, 1.2.3)
        required: true
        type: string
      target_sha:
        description: 40-character commit SHA targeted by tag
        required: true
        type: string
      confirmation:
        description: Type REBUILD_EXISTING_RELEASE to confirm asset replacement
        required: true
        type: string

permissions:
  contents: read

# Serialize normal and recovery releases. This prevents any run from replacing
# or publishing assets while another run is operating on the same release lane.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  calculate_release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_required: ${{ steps.classify.outputs.release_required }}
      version: ${{ steps.classify.outputs.version }}
      tag: ${{ steps.classify.outputs.tag }}
      calculated_sha: ${{ steps.classify.outputs.calculated_sha }}
      bump_type: ${{ steps.classify.outputs.bump_type }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        uses: PaulHatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373
        with:
          branch: HEAD
          tag_prefix: v
          major_pattern: '/^[a-z]+(?:\([^)]*\))?!:/'
          minor_pattern: '/^feat(?:\([^)]*\))?:/'
          version_format: '${major}.${minor}.${patch}'
          search_commit_body: false
          enable_prerelease_mode: false

      - name: Verify version calculation target
        env:
          CALCULATED_COMMIT: ${{ steps.version.outputs.current_commit }}
        run: |
          set -euo pipefail

          [[ -n "$CALCULATED_COMMIT" ]] || { printf '%s\n' 'semantic-version did not return current_commit' >&2; exit 1; }
          [[ "$CALCULATED_COMMIT" == "$GITHUB_SHA" ]] \
            || { printf 'semantic-version current_commit %s does not match GITHUB_SHA %s\n' "$CALCULATED_COMMIT" "$GITHUB_SHA" >&2; exit 1; }

      - name: Classify release commits
        id: classify
        env:
          ACTION_VERSION: ${{ steps.version.outputs.version }}
          ACTION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION_TYPE: ${{ steps.version.outputs.version_type }}
          IS_TAGGED: ${{ steps.version.outputs.is_tagged }}
          PREVIOUS_COMMIT: ${{ steps.version.outputs.previous_commit }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          CURRENT_COMMIT: ${{ steps.version.outputs.current_commit }}
        run: |
          set -euo pipefail

          release_required=false
          bump_level=0

          if [[ "$IS_TAGGED" != 'true' && "$VERSION_TYPE" != 'none' ]]; then
            if [[ -n "$PREVIOUS_COMMIT" ]]; then
              commit_range="$PREVIOUS_COMMIT..$CURRENT_COMMIT"
            else
              commit_range="$CURRENT_COMMIT"
            fi

            breaking_subject='^[a-z]+(\([^)]*\))?!:'
            feature_subject='^feat(\([^)]*\))?:'
            patch_subject='^(fix|perf|revert)(\([^)]*\))?:'

            while IFS= read -r commit; do
              [[ -n "$commit" ]] || continue
              subject="$(git show -s --format=%s "$commit")"
              body="$(git show -s --format=%b "$commit")"
              commit_level=0

              if [[ "$subject" =~ $breaking_subject ]]; then
                commit_level=3
              else
                has_breaking_footer=false
                breaking_footer='^BREAKING( |-)CHANGE: .+$'
                while IFS= read -r line; do
                  line="${line%$'\r'}"
                  if [[ "$line" =~ $breaking_footer ]]; then
                    has_breaking_footer=true
                    break
                  fi
                done <<< "$body"

                if [[ "$has_breaking_footer" == 'true' ]]; then
                  commit_level=3
                elif [[ "$subject" =~ $feature_subject ]]; then
                  commit_level=2
                elif [[ "$subject" =~ $patch_subject ]]; then
                  commit_level=1
                fi
              fi

              if (( commit_level > bump_level )); then
                bump_level="$commit_level"
              fi
            done < <(git rev-list "$commit_range")
          fi

          case "$bump_level" in
            3) bump_type='major' ;;
            2) bump_type='minor' ;;
            1) bump_type='patch' ;;
            *) bump_type='none' ;;
          esac

          if (( bump_level > 0 )); then
            stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            [[ "$PREVIOUS_VERSION" =~ $stable_version ]] \
              || { printf 'invalid previous semantic version: %s\n' "$PREVIOUS_VERSION" >&2; exit 1; }
            IFS=. read -r previous_major previous_minor previous_patch <<< "$PREVIOUS_VERSION"

            case "$bump_level" in
              3) calculated_version="$((previous_major + 1)).0.0" ;;
              2) calculated_version="${previous_major}.$((previous_minor + 1)).0" ;;
              1) calculated_version="${previous_major}.${previous_minor}.$((previous_patch + 1))" ;;
            esac

            calculated_tag="v$calculated_version"
            release_required=true
          else
            calculated_version="$ACTION_VERSION"
            calculated_tag="$ACTION_TAG"
          fi

          {
            printf 'release_required=%s\n' "$release_required"
            printf 'version=%s\n' "$calculated_version"
            printf 'tag=%s\n' "$calculated_tag"
            printf 'calculated_sha=%s\n' "$CURRENT_COMMIT"
            printf 'bump_type=%s\n' "$bump_type"
          } >> "$GITHUB_OUTPUT"

  validate_manual_recovery:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
    steps:
      - name: Require manual recovery dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          [[ "$DISPATCH_REF" == 'refs/heads/main' ]] \
            || { printf 'Manual recovery must be dispatched from refs/heads/main; select main as the workflow ref and retry.\n' >&2; exit 1; }

      - name: Check out repository metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate existing release target
        id: validate
        env:
          REQUEST_TAG: ${{ inputs.tag }}
          REQUEST_VERSION: ${{ inputs.version }}
          REQUEST_TARGET_SHA: ${{ inputs.target_sha }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          stable_tag="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
          [[ "$REQUEST_TAG" =~ $stable_tag ]] \
            || { printf 'invalid recovery tag: %s\n' "$REQUEST_TAG" >&2; exit 1; }
          [[ "$REQUEST_VERSION" =~ $stable_version ]] \
            || { printf 'invalid recovery version: %s\n' "$REQUEST_VERSION" >&2; exit 1; }
          [[ "$REQUEST_VERSION" == "${REQUEST_TAG#v}" ]] \
            || { printf 'recovery tag %s does not match version %s\n' "$REQUEST_TAG" "$REQUEST_VERSION" >&2; exit 1; }
          [[ "$REQUEST_TARGET_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] \
            || { printf '%s\n' 'recovery target_sha must be a 40-character commit SHA' >&2; exit 1; }
          [[ "$REQUEST_CONFIRMATION" == 'REBUILD_EXISTING_RELEASE' ]] \
            || { printf '%s\n' 'confirmation must exactly equal REBUILD_EXISTING_RELEASE' >&2; exit 1; }

          remote_tag_line="$(git ls-remote --refs origin "refs/tags/$REQUEST_TAG")"
          [[ -n "$remote_tag_line" ]] \
            || { printf 'remote tag does not exist: %s\n' "$REQUEST_TAG" >&2; exit 1; }
          read -r remote_tag_object remote_tag_ref <<< "$remote_tag_line"
          [[ "$remote_tag_ref" == "refs/tags/$REQUEST_TAG" ]] \
            || { printf 'remote tag lookup returned an unexpected ref for %s\n' "$REQUEST_TAG" >&2; exit 1; }
          [[ "$remote_tag_object" =~ ^[0-9A-Fa-f]{40}$ ]] \
            || { printf 'remote tag object is not a SHA for %s\n' "$REQUEST_TAG" >&2; exit 1; }

          git fetch --force origin "refs/tags/$REQUEST_TAG:refs/tags/$REQUEST_TAG"
          tag_target_sha="$(git rev-parse --verify "$REQUEST_TAG^{commit}")"
          requested_target_sha="$(printf '%s' "$REQUEST_TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$tag_target_sha" == "$requested_target_sha" ]] \
            || { printf 'tag %s targets %s, not requested target %s\n' "$REQUEST_TAG" "$tag_target_sha" "$requested_target_sha" >&2; exit 1; }

          if ! release_tag="$(gh release view "$REQUEST_TAG" --json tagName --template '{{.tagName}}')"; then
            printf 'remote GitHub release does not exist: %s\n' "$REQUEST_TAG" >&2
            exit 1
          fi
          release_is_draft="$(gh release view "$REQUEST_TAG" --json isDraft --template '{{.isDraft}}')"
          release_is_prerelease="$(gh release view "$REQUEST_TAG" --json isPrerelease --template '{{.isPrerelease}}')"
          [[ "$release_tag" == "$REQUEST_TAG" ]] \
            || { printf 'GitHub release tag %s does not match requested tag %s\n' "$release_tag" "$REQUEST_TAG" >&2; exit 1; }
          [[ "$release_is_draft" == false && "$release_is_prerelease" == false ]] \
            || { printf 'GitHub release %s must be published and stable\n' "$REQUEST_TAG" >&2; exit 1; }

          {
            printf 'tag=%s\n' "$REQUEST_TAG"
            printf 'version=%s\n' "$REQUEST_VERSION"
            printf 'target_sha=%s\n' "$requested_target_sha"
          } >> "$GITHUB_OUTPUT"

  release:
    needs:
      - calculate_release
      - validate_manual_recovery
    if: >-
      ${{ always() &&
          ((github.event_name == 'push' &&
            needs.calculate_release.result == 'success' &&
            needs.calculate_release.outputs.release_required == 'true') ||
           (github.event_name == 'workflow_dispatch' &&
            needs.validate_manual_recovery.result == 'success')) }}
    permissions:
      contents: write
    runs-on: macos-26
    outputs:
      version: ${{ steps.asset_metadata.outputs.version }}
      tag: ${{ steps.asset_metadata.outputs.tag }}
      target_sha: ${{ steps.asset_metadata.outputs.target_sha }}
      dmg_sha: ${{ steps.asset_metadata.outputs.dmg_sha }}
      update_cask: ${{ steps.cask_gate.outputs.update_cask }}
    steps:
      - name: Check out exact release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.validate_manual_recovery.outputs.tag || github.sha }}
          fetch-depth: 0

      - name: Verify release inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALCULATED_COMMIT: ${{ needs.calculate_release.outputs.calculated_sha }}
          PLANNED_VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.validate_manual_recovery.outputs.version || needs.calculate_release.outputs.version }}
          PLANNED_TAG: ${{ github.event_name == 'workflow_dispatch' && needs.validate_manual_recovery.outputs.tag || needs.calculate_release.outputs.tag }}
          PLANNED_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && needs.validate_manual_recovery.outputs.target_sha || github.sha }}
        run: |
          set -euo pipefail

          stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          stable_tag="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
          [[ "$PLANNED_VERSION" =~ $stable_version ]] \
            || { printf 'invalid planned semantic version: %s\n' "$PLANNED_VERSION" >&2; exit 1; }
          [[ "$PLANNED_TAG" =~ $stable_tag && "$PLANNED_TAG" == "v$PLANNED_VERSION" ]] \
            || { printf 'planned tag %s does not match planned version %s\n' "$PLANNED_TAG" "$PLANNED_VERSION" >&2; exit 1; }
          [[ "$PLANNED_TARGET_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] \
            || { printf 'invalid planned target SHA: %s\n' "$PLANNED_TARGET_SHA" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$PLANNED_TARGET_SHA" ]] \
            || { printf 'checked out commit %s does not match planned target %s\n' "$(git rev-parse HEAD)" "$PLANNED_TARGET_SHA" >&2; exit 1; }

          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$CALCULATED_COMMIT" == "$GITHUB_SHA" ]] \
              || { printf 'planned commit %s does not match GITHUB_SHA %s\n' "$CALCULATED_COMMIT" "$GITHUB_SHA" >&2; exit 1; }
            [[ "$PLANNED_TARGET_SHA" == "$GITHUB_SHA" ]] \
              || { printf 'planned target %s does not match GITHUB_SHA %s\n' "$PLANNED_TARGET_SHA" "$GITHUB_SHA" >&2; exit 1; }

            if git rev-parse --verify --quiet "refs/tags/$PLANNED_TAG" >/dev/null; then
              printf 'local tag already exists: %s\n' "$PLANNED_TAG" >&2
              exit 1
            fi

            if [[ -n "$(git ls-remote --refs origin "refs/tags/$PLANNED_TAG")" ]]; then
              printf 'remote tag already exists: %s\n' "$PLANNED_TAG" >&2
              exit 1
            fi
          else
            [[ "$(git rev-parse --verify "$PLANNED_TAG^{commit}")" == "$PLANNED_TARGET_SHA" ]] \
              || { printf 'checked out tag %s does not target %s\n' "$PLANNED_TAG" "$PLANNED_TARGET_SHA" >&2; exit 1; }
          fi

          {
            printf 'RELEASE_VERSION=%s\n' "$PLANNED_VERSION"
            printf 'RELEASE_TAG=%s\n' "$PLANNED_TAG"
            printf 'RELEASE_TARGET_SHA=%s\n' "$PLANNED_TARGET_SHA"
          } >> "$GITHUB_ENV"

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Print release build environment
        run: |
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$MACOS_CERTIFICATE_BASE64" ]] || { printf '%s\n' 'MACOS_CERTIFICATE_BASE64 is required' >&2; exit 1; }
          [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]] || { printf '%s\n' 'MACOS_CERTIFICATE_PASSWORD is required' >&2; exit 1; }
          [[ -n "$MACOS_KEYCHAIN_PASSWORD" ]] || { printf '%s\n' 'MACOS_KEYCHAIN_PASSWORD is required' >&2; exit 1; }

          keychain_path="$RUNNER_TEMP/ambient-sync-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/ambient-sync-developer-id.p12"
          {
            printf 'AMBIENT_SYNC_KEYCHAIN_PATH=%s\n' "$keychain_path"
            printf 'AMBIENT_SYNC_CERTIFICATE_PATH=%s\n' "$certificate_path"
          } >> "$GITHUB_ENV"
          rm -f "$keychain_path" "$certificate_path"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          [[ -n "$APPLE_API_KEY_ID" ]] || { printf '%s\n' 'APPLE_API_KEY_ID is required' >&2; exit 1; }
          [[ -n "$APPLE_API_PRIVATE_KEY" ]] || { printf '%s\n' 'APPLE_API_PRIVATE_KEY is required' >&2; exit 1; }

          api_key_path="$RUNNER_TEMP/ambient-sync-api-key.p8"
          printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          rm -f "$api_key_path"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"

      - name: Build and notarize ZIP and DMG release assets
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # Older release tags may predate this DMG-capable automation. Keep
            # their app source/project checkout exact, but run build automation
            # from the workflow revision that requested recovery.
            git fetch origin "$GITHUB_SHA"
            automation_script="$RUNNER_TEMP/ambient-sync-build-release.sh"
            semver_script="$RUNNER_TEMP/ambient-sync-semver.sh"
            git show "$GITHUB_SHA:scripts/build-release.sh" > "$automation_script"
            git show "$GITHUB_SHA:scripts/semver.sh" > "$semver_script"
            chmod +x "$automation_script"
            printf 'SEMVER_HELPER_PATH=%s\n' "$semver_script" >> "$GITHUB_ENV"
            RELEASE_ROOT_DIR="$GITHUB_WORKSPACE" "$automation_script" "$RELEASE_VERSION"
          else
            printf 'SEMVER_HELPER_PATH=%s\n' "$GITHUB_WORKSPACE/scripts/semver.sh" >> "$GITHUB_ENV"
            ./scripts/build-release.sh "$RELEASE_VERSION"
          fi

      - name: Verify release assets and checksums
        id: asset_metadata
        run: |
          set -euo pipefail

          zip_asset="dist/AmbientSync-${RELEASE_VERSION}.zip"
          dmg_asset="dist/AmbientSync-${RELEASE_VERSION}-arm64.dmg"
          zip_checksum="${zip_asset}.sha256"
          dmg_checksum="${dmg_asset}.sha256"

          for asset in "$zip_asset" "$dmg_asset" "$zip_checksum" "$dmg_checksum"; do
            [[ -s "$asset" ]] || { printf 'release asset missing or empty: %s\n' "$asset" >&2; exit 1; }
          done
          unzip -t "$zip_asset"
          hdiutil verify "$dmg_asset"

          verify_checksum() {
            local asset="$1"
            local checksum="$2"
            local expected_hash=''
            local expected_name=''
            local actual_hash=''
            local actual_name=''

            read -r expected_hash expected_name < "$checksum"
            read -r actual_hash actual_name < <(cd "$(dirname "$asset")" && shasum -a 256 "$(basename "$asset")")
            [[ "$expected_hash" == "$actual_hash" ]] \
              || { printf 'checksum mismatch for %s\n' "$asset" >&2; exit 1; }
            [[ "$expected_name" == "$(basename "$asset")" && "$actual_name" == "$(basename "$asset")" ]] \
              || { printf 'checksum filename mismatch for %s\n' "$asset" >&2; exit 1; }
          }

          verify_checksum "$zip_asset" "$zip_checksum"
          verify_checksum "$dmg_asset" "$dmg_checksum"

          dmg_sha=''
          dmg_sha_name=''
          read -r dmg_sha dmg_sha_name < "$dmg_checksum"
          [[ "$dmg_sha" =~ ^[0-9a-fA-F]{64}$ ]] || { printf '%s\n' 'DMG checksum is not a SHA-256 digest' >&2; exit 1; }
          [[ "$dmg_sha_name" == "$(basename "$dmg_asset")" ]] || { printf '%s\n' 'DMG checksum names unexpected asset' >&2; exit 1; }

          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'target_sha=%s\n' "$RELEASE_TARGET_SHA"
            printf 'dmg_sha=%s\n' "$dmg_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify publish target
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_TARGET_SHA" == "$GITHUB_SHA" ]] \
            || { printf 'planned target %s does not match GITHUB_SHA %s\n' "$RELEASE_TARGET_SHA" "$GITHUB_SHA" >&2; exit 1; }
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]] \
            || { printf 'release tag %s does not match release version %s\n' "$RELEASE_TAG" "$RELEASE_VERSION" >&2; exit 1; }

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            printf 'local tag already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          if [[ -n "$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG")" ]]; then
            printf 'remote tag already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          zip_asset="dist/AmbientSync-${RELEASE_VERSION}.zip"
          dmg_asset="dist/AmbientSync-${RELEASE_VERSION}-arm64.dmg"
          zip_checksum="${zip_asset}.sha256"
          dmg_checksum="${dmg_asset}.sha256"

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            gh release create "$RELEASE_TAG" \
              "$zip_asset" \
              "$dmg_asset" \
              "$zip_checksum" \
              "$dmg_checksum" \
              --target "$RELEASE_TARGET_SHA" \
              --title "AmbientSync $RELEASE_VERSION" \
              --generate-notes
          else
            recovery_ref="refs/recovery/ambient-sync/$GITHUB_RUN_ID"
            cleanup_recovery_ref() {
              git update-ref -d "$recovery_ref" >/dev/null 2>&1 || true
            }
            trap cleanup_recovery_ref EXIT

            # Revalidate immediately before clobbering assets. Fetch into an
            # isolated ref so the checked-out historical tag is never changed.
            git fetch --force origin "refs/tags/$RELEASE_TAG:$recovery_ref"
            remote_target_sha="$(git rev-parse --verify "$recovery_ref^{commit}")"
            [[ "$remote_target_sha" == "$RELEASE_TARGET_SHA" ]] \
              || { printf 'remote tag %s targets %s, not release target %s\n' "$RELEASE_TAG" "$remote_target_sha" "$RELEASE_TARGET_SHA" >&2; exit 1; }

            if ! release_tag="$(gh release view "$RELEASE_TAG" --json tagName --template '{{.tagName}}')"; then
              printf 'GitHub release disappeared before recovery upload: %s\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --template '{{.isDraft}}')"
            release_is_prerelease="$(gh release view "$RELEASE_TAG" --json isPrerelease --template '{{.isPrerelease}}')"
            [[ "$release_tag" == "$RELEASE_TAG" ]] \
              || { printf 'GitHub release tag %s does not match recovery tag %s\n' "$release_tag" "$RELEASE_TAG" >&2; exit 1; }
            [[ "$release_is_draft" == false && "$release_is_prerelease" == false ]] \
              || { printf 'GitHub release %s is not a published stable release\n' "$RELEASE_TAG" >&2; exit 1; }

            gh release upload "$RELEASE_TAG" \
              "$zip_asset" \
              "$dmg_asset" \
              "$zip_checksum" \
              "$dmg_checksum" \
              --clobber
          fi

      - name: Determine cask update gate
        id: cask_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          update_cask=true
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            stable_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            stable_tags=''
            # Use same unbounded comparator as Cask-version protection.
            # shellcheck disable=SC1090 # Manual recovery loads helper from exact workflow revision.
            source "$SEMVER_HELPER_PATH"
            if ! stable_tags="$(gh release list \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')"; then
              printf '%s\n' 'Unable to determine latest stable release; skipping cask update for recovered assets.' >&2
              update_cask=false
            else
              latest_stable_tag=''
              latest_stable_version=''

              while IFS= read -r candidate_tag; do
                [[ -n "$candidate_tag" ]] || continue
                [[ "$candidate_tag" =~ $stable_tag_pattern ]] || continue
                candidate_version="${candidate_tag#v}"
                if [[ -z "$latest_stable_version" ]] || version_is_greater "$candidate_version" "$latest_stable_version"; then
                  latest_stable_tag="$candidate_tag"
                  latest_stable_version="$candidate_version"
                fi
              done <<< "$stable_tags"

              if [[ -z "$latest_stable_tag" ]]; then
                printf '%s\n' 'No stable semantic GitHub release found; skipping cask update for recovered assets.' >&2
                update_cask=false
              elif [[ "$latest_stable_tag" != "$RELEASE_TAG" ]]; then
                printf 'Recovered release %s is not latest stable release %s; skipping cask update.\n' \
                  "$RELEASE_TAG" "$latest_stable_tag" >&2
                update_cask=false
              else
                printf 'Recovered release %s is latest stable release; enabling cask update.\n' "$RELEASE_TAG"
              fi
            fi
          else
            printf 'Normal release %s enables cask update.\n' "$RELEASE_TAG"
          fi

          printf 'update_cask=%s\n' "$update_cask" >> "$GITHUB_OUTPUT"

      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          set +e

          keychain_path="${AMBIENT_SYNC_KEYCHAIN_PATH:-}"
          certificate_path="${AMBIENT_SYNC_CERTIFICATE_PATH:-}"
          api_key_path="${APPLE_API_KEY_PATH:-}"

          if [[ -n "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          fi
          if [[ -n "$certificate_path" ]]; then
            rm -f "$certificate_path"
          fi
          if [[ -n "$api_key_path" ]]; then
            rm -f "$api_key_path"
          fi

  cask_update:
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.update_cask == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_DMG_SHA: ${{ needs.release.outputs.dmg_sha }}
    steps:
      - name: Announce post-release cask update
        run: |
          set -euo pipefail
          printf '%s\n' 'External tap update runs after asset publication; failures leave the GitHub release intact.'
          [[ -n "$HOMEBREW_TAP_TOKEN" ]] || { printf '%s\n' 'HOMEBREW_TAP_TOKEN is required with contents read/write access to fridaypatrick/homebrew-tap' >&2; exit 1; }
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Check out current main for cask update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out external tap default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fridaypatrick/homebrew-tap
          path: homebrew-tap
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Record tap default branch
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          tap_branch="$(git symbolic-ref --short HEAD)"
          git check-ref-format "refs/heads/$tap_branch"
          printf 'TAP_BRANCH=%s\n' "$tap_branch" >> "$GITHUB_ENV"

      - name: Guard against Cask downgrade
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          cask_path='Casks/ambientsync.rb'
          stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          cask_update_allowed=true
          git fetch origin "$TAP_BRANCH"

          if git cat-file -e "origin/$TAP_BRANCH:$cask_path" 2>/dev/null; then
            existing_version=''
            existing_sha=''
            version_line_pattern='^[[:space:]]*version[[:space:]]+"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$'
            sha_line_pattern='^[[:space:]]*sha256[[:space:]]+"([0-9A-Fa-f]{64})"[[:space:]]*$'
            while IFS= read -r line; do
              if [[ "$line" =~ $version_line_pattern ]]; then
                [[ -z "$existing_version" ]] \
                  || { printf '%s\n' 'Tap Cask has multiple version stanzas' >&2; exit 1; }
                existing_version="${BASH_REMATCH[1]}"
              elif [[ "$line" =~ $sha_line_pattern ]]; then
                [[ -z "$existing_sha" ]] \
                  || { printf '%s\n' 'Tap Cask has multiple sha256 stanzas' >&2; exit 1; }
                existing_sha="${BASH_REMATCH[1]}"
              fi
            done < <(git show "origin/$TAP_BRANCH:$cask_path")

            [[ "$existing_version" =~ $stable_version ]] \
              || { printf 'Tap Cask has invalid version: %s\n' "$existing_version" >&2; exit 1; }
            [[ "$existing_sha" =~ ^[0-9A-Fa-f]{64}$ ]] \
              || { printf '%s\n' 'Tap Cask has invalid sha256' >&2; exit 1; }

            # This helper is also sourced by latest-release recovery gating.
            # shellcheck disable=SC1090,SC1091 # Workflow checkout supplies helper path.
            source "$GITHUB_WORKSPACE/scripts/semver.sh"

            normalized_existing_sha="$(printf '%s' "$existing_sha" | tr '[:upper:]' '[:lower:]')"
            normalized_release_sha="$(printf '%s' "$RELEASE_DMG_SHA" | tr '[:upper:]' '[:lower:]')"
            if version_is_greater "$existing_version" "$RELEASE_VERSION"; then
              printf 'Tap Cask version %s is newer than release %s; skipping cask update.\n' \
                "$existing_version" "$RELEASE_VERSION"
              cask_update_allowed=false
            elif [[ "$existing_version" == "$RELEASE_VERSION" && "$normalized_existing_sha" == "$normalized_release_sha" ]]; then
              printf 'Tap Cask already matches release %s and DMG SHA; skipping cask update.\n' "$RELEASE_VERSION"
              cask_update_allowed=false
            fi
          fi

          printf 'CASK_UPDATE_ALLOWED=%s\n' "$cask_update_allowed" >> "$GITHUB_ENV"

      - name: Verify published DMG checksum
        if: ${{ env.CASK_UPDATE_ALLOWED == 'true' }}
        run: |
          set -euo pipefail

          checksum_asset="AmbientSync-${RELEASE_VERSION}-arm64.dmg.sha256"
          dmg_asset="AmbientSync-${RELEASE_VERSION}-arm64.dmg"
          checksum_dir="$RUNNER_TEMP/ambient-sync-cask-release"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" \
            --repo fridaypatrick/ambient-sync \
            --pattern "$checksum_asset" \
            --dir "$checksum_dir"

          checksum_path="$checksum_dir/$checksum_asset"
          [[ -s "$checksum_path" ]] || { printf 'published checksum asset missing: %s\n' "$checksum_asset" >&2; exit 1; }
          published_sha=''
          published_name=''
          read -r published_sha published_name < "$checksum_path"
          normalized_release_sha="$(printf '%s' "$RELEASE_DMG_SHA" | tr '[:upper:]' '[:lower:]')"
          normalized_published_sha="$(printf '%s' "$published_sha" | tr '[:upper:]' '[:lower:]')"
          [[ "$normalized_release_sha" =~ ^[0-9a-f]{64}$ ]] || { printf '%s\n' 'release job returned invalid DMG checksum' >&2; exit 1; }
          [[ "$normalized_published_sha" == "$normalized_release_sha" ]] \
            || { printf '%s\n' 'published DMG checksum differs from release job checksum' >&2; exit 1; }
          [[ "$published_name" == "$dmg_asset" ]] \
            || { printf '%s\n' 'published DMG checksum names unexpected asset' >&2; exit 1; }

          printf 'RELEASE_DMG_SHA=%s\n' "$normalized_published_sha" >> "$GITHUB_ENV"

      - name: Render and commit external tap cask update
        working-directory: homebrew-tap
        if: ${{ env.CASK_UPDATE_ALLOWED == 'true' }}
        run: |
          set -euo pipefail

          cask_path='Casks/ambientsync.rb'
          stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          max_attempts=3

          # Recheck every fetched tap default branch before rendering. A newer concurrent Cask
          # must win; this job never downgrades it.
          # shellcheck disable=SC1090,SC1091 # Workflow checkout supplies helper path.
          source "$GITHUB_WORKSPACE/scripts/semver.sh"
          cask_update_allowed_for_base=true
          check_cask_update_allowed() {
            local existing_version=''
            local existing_sha=''
            local line
            local version_line_pattern='^[[:space:]]*version[[:space:]]+"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$'
            local sha_line_pattern='^[[:space:]]*sha256[[:space:]]+"([0-9A-Fa-f]{64})"[[:space:]]*$'

            cask_update_allowed_for_base=true
            if git cat-file -e "origin/$TAP_BRANCH:$cask_path" 2>/dev/null; then
              while IFS= read -r line; do
                if [[ "$line" =~ $version_line_pattern ]]; then
                  [[ -z "$existing_version" ]] \
                    || { printf '%s\n' 'Tap Cask has multiple version stanzas' >&2; exit 1; }
                  existing_version="${BASH_REMATCH[1]}"
                elif [[ "$line" =~ $sha_line_pattern ]]; then
                  [[ -z "$existing_sha" ]] \
                    || { printf '%s\n' 'Tap Cask has multiple sha256 stanzas' >&2; exit 1; }
                  existing_sha="${BASH_REMATCH[1]}"
                fi
              done < <(git show "origin/$TAP_BRANCH:$cask_path")

              [[ "$existing_version" =~ $stable_version ]] \
                || { printf 'Tap Cask has invalid version: %s\n' "$existing_version" >&2; exit 1; }
              [[ "$existing_sha" =~ ^[0-9A-Fa-f]{64}$ ]] \
                || { printf '%s\n' 'Tap Cask has invalid sha256' >&2; exit 1; }

              normalized_existing_sha="$(printf '%s' "$existing_sha" | tr '[:upper:]' '[:lower:]')"
              normalized_release_sha="$(printf '%s' "$RELEASE_DMG_SHA" | tr '[:upper:]' '[:lower:]')"
              if version_is_greater "$existing_version" "$RELEASE_VERSION"; then
                printf 'Tap Cask version %s is newer than release %s; skipping cask update.\n' \
                  "$existing_version" "$RELEASE_VERSION"
                cask_update_allowed_for_base=false
              elif [[ "$existing_version" == "$RELEASE_VERSION" && "$normalized_existing_sha" == "$normalized_release_sha" ]]; then
                printf 'Tap Cask already matches release %s and DMG SHA; skipping cask update.\n' "$RELEASE_VERSION"
                cask_update_allowed_for_base=false
              fi
            fi
          }

          verify_only_cask_path() {
            local status_line
            local status_path
            while IFS= read -r status_line; do
              [[ -n "$status_line" ]] || continue
              status_path="${status_line:3}"
              [[ "$status_path" == "$cask_path" ]] \
                || { printf 'cask update contains unexpected path: %s\n' "$status_path" >&2; exit 1; }
            done < <(git status --porcelain --untracked-files=all)
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
            git fetch --no-tags origin "$TAP_BRANCH"
            base_oid="$(git rev-parse --verify "origin/$TAP_BRANCH")"
            [[ -z "$(git status --porcelain --untracked-files=all)" ]] \
              || { printf '%s\n' 'cask update checkout has unexpected changes before reset' >&2; exit 1; }
            git reset --hard "$base_oid"
            [[ "$(git rev-parse HEAD)" == "$base_oid" ]] \
              || { printf 'working base %s does not match fetched tap base %s\n' "$(git rev-parse HEAD)" "$base_oid" >&2; exit 1; }

            check_cask_update_allowed
            if [[ "$cask_update_allowed_for_base" != true ]]; then
              exit 0
            fi

            CASK_OUTPUT_PATH="$PWD/$cask_path" "$GITHUB_WORKSPACE/scripts/update-cask.sh" "$RELEASE_VERSION" "$RELEASE_DMG_SHA"
            ruby -c "$cask_path"
            changed_files="$(git diff --name-only "$base_oid" --)"
            [[ -z "$changed_files" || "$changed_files" == "$cask_path" ]] \
              || { printf 'cask update final diff contains unrelated file(s): %s\n' "$changed_files" >&2; exit 1; }
            verify_only_cask_path
            git diff --check
            git add -- "$cask_path"

            staged_files="$(git diff --cached --name-only)"
            [[ -z "$staged_files" || "$staged_files" == "$cask_path" ]] \
              || { printf 'unexpected staged files: %s\n' "$staged_files" >&2; exit 1; }

            if git diff --cached --quiet -- "$cask_path"; then
              printf 'Tap already contains exact generated Cask for release %s; no commit needed.\n' "$RELEASE_VERSION"
              exit 0
            fi

            verify_only_cask_path
            git diff --cached --check
            git commit -m "ci: update Homebrew cask to ${RELEASE_VERSION}"
            commit_oid="$(git rev-parse HEAD)"
            [[ "$(git rev-parse HEAD^)" == "$base_oid" ]] \
              || { printf 'cask commit parent does not match fetched tap base %s\n' "$base_oid" >&2; exit 1; }
            commit_files="$(git diff-tree --no-commit-id --name-only -r "$commit_oid")"
            [[ "$commit_files" == "$cask_path" ]] \
              || { printf 'cask commit must change exactly %s, got: %s\n' "$cask_path" "$commit_files" >&2; exit 1; }
            [[ -z "$(git status --porcelain --untracked-files=all)" ]] \
              || { printf '%s\n' 'cask commit left unexpected uncommitted changes' >&2; exit 1; }

            # Normal fast-forward only. Concurrent tap branch movement causes push
            # rejection, then next attempt fetches, resets, and renders again.
            if git push origin "HEAD:refs/heads/$TAP_BRANCH"; then
              printf 'Committed cask update %s to tap branch %s at %s\n' "$RELEASE_VERSION" "$TAP_BRANCH" "$commit_oid"
              exit 0
            else
              push_status=$?
            fi
            printf 'External tap push failed on attempt %d/%d. Check HOMEBREW_TAP_TOKEN contents write access and tap branch rules for its owner; no force push or bypass was attempted.\n' \
              "$attempt" "$max_attempts" >&2
            if (( attempt == max_attempts )); then
              if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
                {
                  printf '## Homebrew cask direct commit failed\n\n'
                  printf '%s\n' '- Release assets were already published; no release rollback was attempted.'
                  printf '%s\n' '- External tap push requires HOMEBREW_TAP_TOKEN contents write access and branch rules permitting its owner to push.'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              exit "$push_status"
            fi
            printf 'Retrying cask update from latest tap default branch.\n' >&2
          done
